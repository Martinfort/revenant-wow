name: Raid-Helper sync

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/raidhelper.yml"
      - "scripts/raidhelper_sync.py"

permissions:
  contents: write

concurrency:
  group: raidhelper-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Read Raid-Helper
        run: python3 scripts/raidhelper_sync.py
        env:
          RAIDHELPER_API_KEY: ${{ secrets.RAIDHELPER_API_KEY }}
          RAIDHELPER_SERVER_ID: ${{ secrets.RAIDHELPER_SERVER_ID }}
      - name: Commit if anything changed
        run: |
          git config user.name "raidhelper-sync"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/raidhelper.json
          if git diff --cached --quiet; then echo "Nothing new"; else git commit -m "Raid-Helper: events updated" && git push; fi
